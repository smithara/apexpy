name: Build wheels

on: [push, pull_request, workflow_dispatch]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # ARM native
            gcc_version: 15
          - os: macos-15-intel    # Intel native
            gcc_version: 15
          - os: windows-2025
            gcc_version: 15
          - os: ubuntu-24.04
            gcc_version: 14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fortran
        # https://github.com/marketplace/actions/setup-fortran
        uses: fortran-lang/setup-fortran@v1.8.1
        id: setup-fortran
        with:
          compiler: gcc
          version: ${{ matrix.gcc_version }}

      - name: Build wheels
        # https://github.com/pypa/cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Select only these Python versons
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          # ...on these platforms
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_MACOS: "native"
          CIBW_ARCHS_LINUX: "native"
          CIBW_ARCHS_WINDOWS: "native"
          # Additional configuration for builds
          CIBW_BUILD_FRONTEND: "pip"
          # Use standard CPython on Windows instead of NuGet
          CIBW_CONFIG_SETTINGS_WINDOWS: "setup-args=-Dpython.platlibdir=Lib"
          # Environment per platform
          CIBW_ENVIRONMENT_LINUX: "CC=$CC FC=$FC"
          CIBW_ENVIRONMENT_WINDOWS: "CMAKE_GENERATOR=\"MinGW Makefiles\" CC=$CC FC=$FC"
          CIBW_ENVIRONMENT_MACOS: "CC=$CC FC=$FC MACOSX_DEPLOYMENT_TARGET=15.0"
          # Run the tests against the built package
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -c "import apexpy"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
