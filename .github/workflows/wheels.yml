name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Fortran
        # https://github.com/marketplace/actions/setup-fortran
        uses: fortran-lang/setup-fortran@v1.8.1
        id: setup-fortran
        with:
          compiler: gcc
          version: ${{ matrix.os == 'ubuntu-24.04' && '13' || '15' }}

      - name: Build wheels
        # https://github.com/pypa/cibuildwheel
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Disable building for PyPy, 32bit, musllinux
          CIBW_SKIP: pp* *-win32 *_i686 *musllinux*
          # Select only these Python versons
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-*
          # Additional configuration for builds
          CMAKE_GENERATOR: MinGW Makefiles
          CIBW_BUILD_FRONTEND: "pip"
          # Run the tests against the built package
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -c "import apexpy"

      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
